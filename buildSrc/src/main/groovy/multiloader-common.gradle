plugins {
    id("java")
    id("java-library")
    id("maven-publish")
    id("eclipse")
    id("idea")
}

base {
    archivesName = "${mod_id}-common-${minecraft_version}"
    version = mod_version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenLocal();
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "SpongePowered Maven"
                url = "https://repo.spongepowered.org/repository/maven-public"
            }
        }

        filter {
            includeGroupAndSubgroups("org.spongepowered")
        }
    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = "ParchmentMC Maven"
                    url = "https://maven.parchmentmc.org/"
                },

                maven {
                    name = "NeoForge Maven"
                    url = "https://maven.neoforged.net/releases"
                }
        )
        filter {
            includeGroup("org.parchmentmc.data")
        }
    }

    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }

    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }

    maven {
        name = "BlameJared maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "RyanLiptak Maven"
        url = "https://maven.ryanliptak.com/"
    }

    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/releases"
    }

    maven {
        name = "DevOS Maven (Snapshots)"
        url = "https://mvn.devos.one/snapshots/"
    }

    maven {
        name = "DevOS Maven (Releases)"
        url = "https://mvn.devos.one/releases/"
    }

    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }

    maven {
        name = "Meme Man Maven"
        url = "https://dl.cloudsmith.io/public/meme-man-mods/nexus/maven/"
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def props = new Properties()

    rootProject.file('gradle.properties').withInputStream { props.load(it) }

    // Filter out any non-String values and system properties
    def replaceProperties = [:]

    props.each { key, value ->
        if (value instanceof String) {
            replaceProperties.put(key, value)
        }
    }

    inputs.properties(replaceProperties)
    filesMatching(['META-INF/mods.toml', 'fabric.mod.json', 'pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties + [project: project]
    }

    exclude '**/.cache/'

    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.getRelease().set(17)
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.addStringOption('Xdoclint', 'none')
    it.failOnError = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            version = mod_version
            group = mod_group

            from components.java
        }
    }
}
